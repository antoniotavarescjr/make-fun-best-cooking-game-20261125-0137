<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Bistrô das 3:33: jogo de cozinha 8-bit — monte pratos cômicos de terror para monstros antes que a paciência deles acabe.">
<title>Bistrô das 3:33 — cozinhe para monstros</title>
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<div id="wrap">
  <header id="topbar">
    <div id="brand">
      <h1>BISTRÔ DAS 3:33</h1>
      <p id="phase">TURNO NORMAL</p>
    </div>
    <div id="orders" aria-label="Quadro de pedidos"></div>
    <div id="timers">
      <span id="timer">TEMPO 3:00</span>
      <span id="clock">RELÓGIO 3:00</span>
      <span id="score">Pontos 0</span>
      <span id="combo">COMBO ×1</span>
      <span id="served">Servidos 0 · Perdidos 0</span>
    </div>
  </header>
  <main>
    <canvas id="game" width="1280" height="480" aria-label="Bistrô das 3:33: cozinha 8-bit onde você monta pratos para monstros antes que a paciência deles acabe"></canvas>
  </main>
  <footer id="bottombar">
    <div id="plate-strip" aria-label="Prato em montagem"></div>
    <div id="controls">
      <span id="hands">Mãos vazias — pegue na despensa</span>
      <button id="cursed-btn" type="button" title="Tecla B">＋ PIMENTA DO ALÉM (B)</button>
      <button id="start-btn" type="button">COMEÇAR / RECOMEÇAR</button>
      <span id="message" role="status"></span>
    </div>
    <p id="help">WASD ou setas andam · E ou clique usa a bancada · 1-3 escolhe o pedido · Q/T troca o ingrediente · P pausa · M som</p>
  </footer>
</div>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
